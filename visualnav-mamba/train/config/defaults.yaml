project_name: nomad-mamba
run_name: nomad-mamba

# training setup
use_wandb: True
train: True
batch_size: 256
eval_batch_size: 128
epochs: 150
gpu_ids: [0]
num_workers: 24
lr: 1e-4
optimizer: adamw
clipping: True
max_norm: 1.0
scheduler: "cosine"
warmup: True
warmup_epochs: 5
cyclic_period: 0
plateau_patience: 0
plateau_factor: 0.5
seed: 0


# DataLoader 优化参数
pin_memory: True  # 加速 CPU->GPU 数据传输
prefetch_factor: 4  # 预取批次数，减少 GPU 等待

# 多数据集联合训练优化参数
use_interleaved_sampler: True  # 是否使用交错采样器（多数据集时建议开启）
sampler_chunk_size: 512  # 交错采样器的 chunk 大小，越大切换越少但随机性越差

# Weight decay
weight_decay: 0.05

# EMA (Exponential Moving Average) parameters
use_ema: False
ema_decay: 0.999

# model params - only nomad_mamba is supported
model_type: nomad
vision_encoder: nomad_mamba
encoding_size: 256

# Vision encoder configuration (timm models)
# Supported models: efficientnet_b0, efficientnet_b1, efficientnet_b2, efficientnet_b3,
#                   efficientnetv2_s, efficientnetv2_m, resnet18, resnet34, resnet50,
#                   convnext_tiny, convnext_small, mobilenetv3_small_100, mobilenetv3_large_100
#                   mobilenetv4_conv_small, mobilenetv4_conv_medium, mobilenetv4_conv_large,
#                   mobilenetv4_hybrid_medium, mobilenetv4_hybrid_large,
#                   vit_small_patch16_dinov3, vit_base_patch16_dinov3, vit_large_patch16_dinov3
obs_encoder: efficientnet_b0  # 观测编码器模型名称
goal_encoder: null  # 目标编码器模型名称，null 表示使用与 obs_encoder 相同的模型
pretrained: true  # 是否使用预训练权重

attn_unet: False
cond_predict_scale: False

# Mamba specific parameters
mamba_d_state: 64
mamba_d_conv: 4
mamba_expand: 2
mamba_headdim: 64
mamba_num_blocks: 4
mamba_chunk_size: 256
mamba_use_mem_eff: True

# Mamba regularization parameters
mamba_dropout: 0.15
mamba_drop_path: 0.15

# U-Net parameters
down_dims: [64, 128, 256]

# diffusion model params
num_diffusion_iters: 10

# goal mask
goal_mask_prob: 0.5

# normalization for the action space
normalize: True

# context
context_type: temporal
context_size: 0
alpha: 1e-4

# distance bounds for distance and action predictions
distance:
  min_dist_cat: 0
  max_dist_cat: 20
action:
  min_dist_cat: 3
  max_dist_cat: 20

# action output params
len_traj_pred: 8
learn_angle: False

# dataset specific parameters
image_size: [96, 96]
goal_type: "image"

# data augmentations
augmentations:
  color_jitter: 0.4
  p_blur: 0.15
  p_gray: 0.15

# datasets configuration
datasets:
  # go_stanford:
  #   data_folder: /home/zhang1037/project/cai/Navigation/datasets/go_stanford
  #   train: vint_train/data/data_splits/go_stanford/train/
  #   test: vint_train/data/data_splits/go_stanford/test/
  #   end_slack: 0 # 允许预测轨迹终点与真实终点之间的最大容忍距离（单位：轨迹点索引）
  #   goals_per_obs: 2 # 对每一个观测帧（observation），从其未来轨迹中随机采样多少个目标（goal）图像
  #   negative_mining: True # 是否启用 ViNG 论文（Shah et al.）提出的负采样策略
  recon:
    data_folder: /home/zhang1037/project/cai/Navigation/datasets/recon00
    train: vint_train/data/data_splits/recon00/train/ # path to train folder with traj_names.txt
    test: vint_train/data/data_splits/recon00/test/ # path to test folder with traj_names.txt
    end_slack: 3 # because many trajectories end in collisions
    goals_per_obs: 1 # how many goals are sampled per observation
    negative_mining: True # negative mining from the ViNG paper (Shah et al.)

# logging
print_log_freq: 1000
image_log_freq: 10000
num_images_log: 8
pairwise_test_freq: 0
eval_fraction: 0.25
wandb_log_freq: 10
eval_freq: 1
